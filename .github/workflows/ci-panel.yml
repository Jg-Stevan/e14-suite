# CI del panel — supervision-e14 (paths-filter: app + motor)
# NOTA: scaffold. El panel usa bun:test con bunfig.toml + preload; 'verificar'
# debe existir en su package.json (si tiene otro nombre, ajusta el paso).
name: ci — supervision (supervision-e14)

on:
  push:
    branches: [main]
    paths: ["apps/supervision-e14/**", "packages/scanner-core/**"]
  pull_request:
    paths: ["apps/supervision-e14/**", "packages/scanner-core/**"]

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      # Pines por SHA (R-13): un tag re-publicado jamás ejecuta código sin revisión.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - name: instalar workspaces (lockfile de la raíz)
        run: bun install --frozen-lockfile

      # R-12: cache de assets (migra del ci.yml anidado que GitHub jamás
      # ejecutó) — los tests de dict-v5 y de contrato leen los binarios del
      # motor; el cache evita bajar ~37 MB por corrida.
      - name: Cache de assets externos
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            apps/supervision-e14/public/models/rapidocr/*.onnx
            apps/supervision-e14/public/models/tesseract/*.traineddata.gz
            apps/supervision-e14/public/vendor/opencv-4.5.5-core.js
          key: assets-panel-${{ runner.os }}-${{ hashFiles('apps/supervision-e14/scripts/assets.lock.json') }}

      - name: verificar del panel
        working-directory: apps/supervision-e14
        run: bun run verificar

      # R-37: primera MEDICIÓN de cobertura del panel (52,26 % statements
      # medido 2026-11-16 — antes ni estaba declarada). bun reporta sin
      # umbral duro: el reporte se publica como artefacto y el número es
      # observable por SHA.
      - name: Cobertura (bun test --coverage)
        working-directory: apps/supervision-e14
        run: bun test --coverage
