# Deploy móvil — Cloudflare vía opennextjs-cloudflare (mismo entorno que
# ci-build.yml valida en cada PR). Requiere secrets:
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID  (ver docs/PENDIENTES-TOKEN.md)
name: deploy — movil (Cloudflare / opennextjs)

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: deploy-movil
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - name: instalar workspaces (lockfile de la raíz)
        run: bun install --frozen-lockfile

      - name: build (opennextjs-cloudflare)
        working-directory: apps/digielect14
        run: bunx opennextjs-cloudflare build
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: deploy (opennextjs-cloudflare)
        working-directory: apps/digielect14
        run: bunx opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
