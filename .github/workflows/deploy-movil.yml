# Deploy móvil — Cloudflare vía opennextjs-cloudflare
# REVISAR antes del primer push: alinear con el pipeline actual del repo viejo
# (comandos exactos de build/deploy pueden diferir). Requiere secrets:
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID  (ver PENDIENTES-TOKEN.md)
name: deploy — movil (Cloudflare / opennextjs)

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: deploy-movil
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: instalar workspaces (lockfile de la raíz)
        run: bun install --frozen-lockfile

      - name: build (opennextjs-cloudflare)
        working-directory: apps/digielect14
        run: bunx opennextjs-cloudflare build
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: deploy (opennextjs-cloudflare)
        working-directory: apps/digielect14
        run: bunx opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
