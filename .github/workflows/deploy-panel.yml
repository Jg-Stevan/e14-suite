# Deploy panel — Cloudflare Pages (export estático + Pages Function de wasm partido)
#
# GitHub Pages quedó retirado. El panel se publica con `wrangler pages deploy`
# desde apps/supervision-e14: wrangler toma `pages_build_output_dir` de
# wrangler.toml y compila la Function de functions/vendor/onnxruntime.
#
# Requiere los secrets CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID.
name: deploy — supervision (Cloudflare Pages)

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: deploy-panel
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: instalar workspaces (lockfile de la raíz)
        run: bun install --frozen-lockfile

      - name: build (export estático)
        working-directory: apps/supervision-e14
        env:
          BUILD_STATIC: "1"
          NEXT_PUBLIC_BASE_PATH: ""
        run: bun run build

      - name: partir wasm > 25 MiB y escribir _routes.json
        working-directory: apps/supervision-e14
        run: bun scripts/cf-wasm-partes.mjs

      # Pages no deja subir un archivo > 25 MiB y el ZIP del sidecar pesa ~108.
      # Se parte en el deploy y /descargas/sidecar/ lo reensambla en el navegador.
      # Sin release sidecar-v* el deploy sigue: la página avisa que no está
      # publicada. El asset conserva el nombre que fija la tarjeta.
      - name: preparar la descarga del sidecar (partes < 25 MiB)
        working-directory: apps/supervision-e14
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(gh release list --exclude-drafts --exclude-pre-releases --limit 50 \
            --json tagName --jq '.[] | .tagName' | grep '^sidecar-v' | head -n1 || true)"
          if [ -z "$tag" ]; then
            echo "Sin release sidecar-v*: la página avisará que la descarga no está publicada."
            exit 0
          fi
          tmp="$(mktemp -d)"
          gh release download "$tag" -R "$GITHUB_REPOSITORY" \
            --pattern 'supervision-e14-sidecar-win-x64.zip' --dir "$tmp"
          node scripts/partir-descarga-sidecar.mjs \
            "$tmp/supervision-e14-sidecar-win-x64.zip" out/descargas/sidecar

      - name: deploy (Cloudflare Pages)
        working-directory: apps/supervision-e14
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bunx wrangler pages deploy --project-name supervision-e14 --branch main
