# CI del motor — scanner-core (paths-filter: solo cuando cambia el paquete)
# El paquete es runtime-agnostic (bun:test puro): tests + cobertura; el
# typecheck y lint por app viven en ci-movil/ci-panel vía test:paquete.
name: motor — scanner-core

on:
  push:
    branches: [main]
    paths: ["packages/scanner-core/**"]
  pull_request:
    paths: ["packages/scanner-core/**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - name: instalar workspaces (lockfile de la raíz)
        run: bun install --frozen-lockfile

      - name: suite del motor (golden contrato-motor.json — el conteo lo imprime el runner)
        run: bun test packages/scanner-core

      # R-37: cobertura del paquete medida y publicada (72,20 % statements
      # medido 2026-11-16 — la suite más alta del monorepo).
      - name: Cobertura (bun test --coverage)
        run: bun test packages/scanner-core --coverage

      - name: typecheck del paquete (si existe el script)
        run: cd packages/scanner-core && bun run typecheck || echo "(sin script typecheck — omitido)"
