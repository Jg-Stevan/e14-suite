name: Release sidecar nativo

# KIT e14-sidecar-instalable-v1 (D81).
#
# Corre `scripts/empaquetar-sidecar.mjs` (PyInstaller --onedir + verificación
# estática del bundle) y publica el ZIP resultante como asset de una GitHub
# Release de ESTE repo (privado). La tarjeta «ACELERADOR NATIVO» no apunta a la
# release: el deploy del panel baja el asset y lo sirve partido en trozos de
# < 25 MiB desde `/descargas/sidecar/`, porque un visitante no tiene login y
# Pages rechaza archivos mayores. Solo va el binario: sin actas, sin datos de
# jurados y sin el código fuente del panel.
#
# Vive en la RAÍZ del monorepo porque GitHub Actions solo ejecuta workflows de
# `.github/workflows/`. El empaquetado corre con `working-directory:
# apps/supervision-e14`; el ZIP queda en apps/supervision-e14/dist/.
#
# El NOMBRE del asset es parte del contrato de la UI: cambiarlo sin cambiar
# `ARCHIVO_SIDECAR` en componentes/e14/screens/masiva/acelerador.tsx deja la
# descarga en un 404 silencioso. Lo usan el deploy del panel
# (`scripts/partir-descarga-sidecar.mjs`) y lo fija
# `masiva/__tests__/acelerador-tarjeta.test.ts`.
#
# Corre en Windows porque PyInstaller NO cross-compila: un runner de Linux no
# puede producir un .exe. El build local es el mismo script
# (`node scripts/empaquetar-sidecar.mjs`); este workflow usa Node, no Bun, para
# no depender de install en el runner — el script solo usa APIs de node:*.
#
# El exe se firma con la clave del repositorio? NO. Queda sin firmar y SmartScreen
# lo va a interrumpir la primera vez; la tarjeta ya lo dice en su texto. Firmar
# cuesta un EV code signing cert y no entra en esta decisión.
#
# R-42 (auditoría 2026-11-16) — verificabilidad del binario publicado. Con los
# pines exactos de R-08 (native/requirements.txt) quedaba la mitad del hueco
# §6.8: el .exe que se distribuye. Este workflow además de empaquetar REGISTRA
# la identidad del asset: SHA-256 del ZIP en `SHA256SUMS.txt` (adjunto a la
# release y al artifact) e inventario recursivo con tamaños del bundle en
# `INVENTARIO-BUNDLE.txt` (qué .dll/.pyd viajan dentro de los ~240 MiB). El
# contrato verificable y sus límites honestos (PyInstaller NO es bit a bit
# reproducible): `native/BUILD-REPRODUCIBLE.md`.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versión del sidecar (semver, sin la 'v') — el tag será sidecar-v<version>"
        required: true
        default: "1.0.0"
      prerelease:
        description: "Marcar la release como prerelease (NO la muestra en /latest)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: sidecar-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    env:
      # El script lee CI para poner el venv dentro del workspace (.venv-sidecar)
      # en vez de %LOCALAPPDATA% — así lo cachea Actions.
      CI: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          # 3.12 y no 3.14: en la 3.14 el build local funciona, pero PyInstaller
          # + opencv + onnxruntime sobre una Python recién salida tiene hooks que
          # se están arreglando aún. El runner debe producir el binario aburrido.
          python-version: "3.12"
          cache: "pip"

      # Los .onnx NO se versionan (.gitignore): los materializa este script con
      # URL + SHA-256 de scripts/assets.lock.json. Sin este paso el checkout solo
      # trae los .txt y PyInstaller arma un bundle sin det_v5_mobile.onnx que
      # revienta al arrancar (NO_SUCHFILE), no al empaquetar.
      - name: Preparar modelos OCR (URL + SHA-256 fijados)
        working-directory: apps/supervision-e14
        run: node scripts/preparar-assets.mjs

      # El runner windows-latest mata el .exe sin firmar a los pocos segundos
      # (exit=1 justo después de LISTO, sin traceback), así que lanzarlo aquí es
      # un falso negativo. --sin-ejecutar NO es --sin-verificar: comprueba cada
      # .onnx del lock contra su SHA-256, aplica el piso de tamaño y produce el
      # ZIP. El arranque real se prueba en una máquina limpia antes de anunciar
      # la release (RUNBOOK §B.3).
      - name: Empaquetar (venv + pip + PyInstaller; verificación estática)
        working-directory: apps/supervision-e14
        run: node scripts/empaquetar-sidecar.mjs --sin-ejecutar

      # R-42 — el asset publicado deja de ser opaco. El SHA-256 ya viajaba en el
      # cuerpo de la release, pero un cuerpo se edita y un asset se re-sube:
      # nada ataba el hash al archivo. Este paso registra la identidad del ZIP
      # en archivos que viajan CON la release (sobreviven al log del runner):
      #   · `SHA256SUMS.txt` — el contrato estándar (`sha256sum -c`).
      #   · `INVENTARIO-BUNDLE.txt` — dir recursivo con tamaños del onedir:
      #     trazabilidad de QUÉ código nativo (.dll/.pyd de onnxruntime/
      #     opencv/numpy) viaja dentro del binario, con totales. El mismo
      #     inventario se vuelca al log de esta corrida.
      # El paso de publicación lee el hash de AQUÍ: un solo cálculo entre el
      # cuerpo de la release y el adjunto — imposible que diverjan.
      - name: Registrar SHA-256 + inventario del bundle (R-42)
        working-directory: apps/supervision-e14
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          ZIP="supervision-e14-sidecar-win-x64.zip"
          DIR="supervision-e14-sidecar"
          echo "── SHA-256 del asset publicado ────────────────────────────"
          sha256sum "$ZIP" | tee SHA256SUMS.txt
          echo ""
          echo "── DLLs/.pyd nativos del bundle ($DIR) ────────────────────"
          find "$DIR" -type f \( -iname '*.dll' -o -iname '*.pyd' \) -printf '%10s  %p\n' | sort -k2
          echo ""
          echo "── Inventario completo (recursivo, con tamaños) ────────────"
          find "$DIR" -type f -printf '%10s  %p\n' | sort -k2
          {
            echo "# Inventario del bundle onedir del sidecar (R-42 — supply chain)."
            echo "# Generado por .github/workflows/sidecar-release.yml el $(date -u +%Y-%m-%dT%H:%M:%SZ)."
            echo "# Formato: <bytes>  <ruta desde la raíz del bundle>. El SHA-256 del ZIP"
            echo "# está en SHA256SUMS.txt; el contrato de reproducibilidad y cómo"
            echo "# verificar una descarga, en native/BUILD-REPRODUCIBLE.md."
            echo ""
            find "$DIR" -type f -printf '%10s  %p\n' | sort -k2
            echo ""
            echo "archivos totales : $(find "$DIR" -type f | wc -l)"
            echo "bytes totales    : $(find "$DIR" -type f -printf '%s\n' | awk '{s+=$1} END {print s}')"
            echo "dll/pyd nativos  : $(find "$DIR" -type f \( -iname '*.dll' -o -iname '*.pyd' \) | wc -l)"
          } > INVENTARIO-BUNDLE.txt

      - name: Publicar la release
        working-directory: apps/supervision-e14
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="sidecar-v${VERSION}"
          ZIP="dist/supervision-e14-sidecar-win-x64.zip"
          # R-42: el hash sale del SHA256SUMS.txt del paso anterior — UN solo
          # cálculo entre el cuerpo de la release y el adjunto.
          sha=$(head -1 dist/SHA256SUMS.txt | cut -d' ' -f1)
          mib=$(( $(wc -c <"$ZIP") / 1048576 ))
          cat > cuerpo.md <<EOF
          Sidecar nativo del digitalizador E-14: det+rec de RapidOCR en CPU con
          onnxruntime, sobre los mismos \`.onnx\` del sitio. NO necesita Python.

          Descomprime la carpeta y ejecuta \`supervision-e14-sidecar.exe\` (~${mib} MiB
          descargados, 240 MiB en disco). \`GET http://127.0.0.1:8765/salud\`
          responde cuando está vivo y la vista CARGA MASIVA lo detecta sola.

          Primera corrida: 5-15 s (Defender escanea los 240 MiB recién escritos);
          después, 4,5-6,3 s hasta \`/salud\`.

          **SHA-256:** \`$sha\` — también adjunto como \`SHA256SUMS.txt\`
          (verificable con \`sha256sum -c\`). \`INVENTARIO-BUNDLE.txt\` (adjunto)
          lista el contenido del ZIP con tamaños. Cómo reconstruir y qué es
          verificable: \`native/BUILD-REPRODUCIBLE.md\`.

          **SmartScreen:** binario sin firmar → «Más información → Ejecutar de
          todas formas».
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" dist/SHA256SUMS.txt dist/INVENTARIO-BUNDLE.txt --clobber
            gh release edit "$TAG" --notes-file cuerpo.md
          else
            args=(--title "Sidecar nativo $TAG" --notes-file cuerpo.md)
            [ "$PRERELEASE" = "true" ] && args+=(--prerelease)
            gh release create "$TAG" "$ZIP" dist/SHA256SUMS.txt dist/INVENTARIO-BUNDLE.txt "${args[@]}"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: supervision-e14-sidecar-win-x64
          # R-42: el hash y el inventario viajan también en el artifact — se
          # puede verificar el ZIP sin abrir la release.
          path: |
            apps/supervision-e14/dist/supervision-e14-sidecar-win-x64.zip
            apps/supervision-e14/dist/SHA256SUMS.txt
            apps/supervision-e14/dist/INVENTARIO-BUNDLE.txt
          retention-days: 30
