# Deploy móvil — Cloudflare Pages (export estático en la raíz)
#
# Canal Pages de digielect14. El canal Worker (opennextjs) sigue en
# deploy-movil.yml. Este workflow usa un `--cwd` temporal a propósito:
# apps/digielect14/wrangler.jsonc describe el Worker de OpenNext y
# `wrangler pages deploy` no debe leerlo.
#
# Requiere los secrets CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID.
name: deploy — movil (Cloudflare Pages)

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: deploy-movil-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: instalar workspaces (lockfile de la raíz)
        run: bun install --frozen-lockfile

      # R-12 (auditoría 2026-11-16): paso PERDIDO en la consolidación al
      # monorepo — el deploy anidado original (deploy-cf.yml) derivaba la
      # versión del SW del SHA del commit ANTES del build; sin esto el SW
      # servido queda con el fallback «e14-v1» y los clientes no detectan
      # actualizaciones (la detección la hace ci-programados.yml → frescura).
      - name: Derivar versión del SW del build (6.6)
        working-directory: apps/digielect14
        run: |
          VERSION="e14-$(git rev-parse --short HEAD)"
          sed -i "s/const VERSION = \".*\";/const VERSION = \"$VERSION\";/" public/sw.js
          # El cache-busting `?v=` del detection-worker vive en el FUENTE del
          # consumidor (packages/scanner-core/src/core/detector-client.ts) —
          # mismo sed que el deploy anidado original.
          VQ=$(echo "$VERSION" | md5sum | cut -c1-6)
          sed -i "s/?v=[0-9]*/?v=$VQ/g" ../../packages/scanner-core/src/core/detector-client.ts
          echo "VERSION del SW = $VERSION · ?v = $VQ"

      - name: build (export estático)
        working-directory: apps/digielect14
        env:
          BUILD_STATIC: "1"
          NEXT_PUBLIC_BASE_PATH: ""
        run: bun run build

      - name: deploy (Cloudflare Pages)
        working-directory: apps/digielect14
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          directorio="$(mktemp -d)"
          bunx wrangler pages deploy "$GITHUB_WORKSPACE/apps/digielect14/out" \
            --project-name digielect14 --branch main --cwd "$directorio"
