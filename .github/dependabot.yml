# Dependabot — e14-suite (R-04, auditoría 2026-11-16)
#
# La auditoría A encontró 3 CVEs de toolchain (zod/glob/minimatch) que ninguna
# puerta interna detectó: sin `bun audit` ni Dependabot en el repo. Esto trae
# actualizaciones automáticas de dependencias y de las actions del CI (que
# R-13 pinea por SHA — Dependabot las mantiene al día con su propio PR).
#
# Mínimo privilegio: los PRs de Dependabot corren el CI normal (permissions
# de cada workflow); no se le da ningún token extra aquí.

version: 2
updates:
  # Dependencias del workspace bun (lockfile raíz)
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Las devDeps de toolchain van juntas: menos ruido, mismo gate
      toolchain-dev:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 5

  # Actions de los workflows (mantiene los pines por SHA de R-13 al día)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci(deps)"
    open-pull-requests-limit: 5
